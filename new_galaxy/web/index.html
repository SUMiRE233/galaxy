<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Galaxy</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MULTIMEDIA DATA VISUALIZATION</p>
        <h1>Music Galaxy</h1>
        <p class="subtitle">基于音频特征的动态音乐相似关系星图</p>
      </div>
      <div class="stats" aria-label="数据统计">
        <div><strong id="track-count">--</strong><span>歌曲</span></div>
        <div><strong id="edge-count">--</strong><span>关系</span></div>
        <div><strong id="genre-count">--</strong><span>流派</span></div>
      </div>
    </header>

    <section class="toolbar">
      <label>
        <span>流派</span>
        <select id="genre-filter">
          <option value="all">全部流派</option>
        </select>
      </label>
      <label>
        <span>数据来源</span>
        <select id="source-filter">
          <option value="all">全部来源</option>
          <option value="demo">Demo</option>
          <option value="personal">Personal</option>
          <option value="fma">FMA</option>
        </select>
      </label>
      <button id="reset-filter" type="button">重置筛选</button>
      <p class="hint"><i></i> 拖拽节点探索星系，滚轮缩放，点击查看详情</p>
    </section>

    <main class="content">
      <section class="chart-card">
        <div id="music-graph" role="img" aria-label="音乐相似关系力导向图"></div>
        <div id="loading" class="loading">正在载入音乐星系...</div>
      </section>

      <aside class="detail-panel">
        <div id="empty-detail" class="empty-detail">
          <div class="planet"></div>
          <h2>选择一颗音乐星球</h2>
          <p>点击图中的节点，查看歌曲特征和它最相似的音乐。</p>
        </div>
        <div id="song-detail" class="song-detail hidden">
          <div class="detail-heading">
            <span id="detail-source" class="source-badge"></span>
            <span id="detail-genre" class="genre-badge"></span>
          </div>
          <h2 id="detail-title"></h2>
          <p id="detail-artist" class="artist"></p>
          <div class="player-bar">
            <button id="btn-play" class="btn-play" title="播放 / 暂停">&#9654;</button>
            <div class="player-wave" id="player-wave"></div>
            <span id="play-time" class="play-time">00:00</span>
          </div>
          <div class="feature-grid">
            <div><span>BPM</span><strong id="detail-tempo"></strong></div>
            <div><span>Energy / RMS</span><strong id="detail-energy"></strong></div>
            <div><span>频谱质心</span><strong id="detail-centroid"></strong></div>
          </div>
          <div class="recommendation-block">
            <h3>Top 相似歌曲</h3>
            <ol id="recommendation-list"></ol>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="visualizer-overlay" class="visualizer-overlay hidden">
    <canvas id="viz-canvas"></canvas>
    <div class="viz-controls">
      <button id="viz-close" class="viz-close" title="返回星图">&#10005;</button>
      <div class="viz-track">
        <span id="viz-genre" class="viz-genre-badge"></span>
        <strong id="viz-title"></strong>
        <small id="viz-artist"></small>
      </div>
      <div class="viz-actions">
        <button id="viz-play" class="viz-play-btn">&#9654;</button>
        <span id="viz-time">00:00</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
